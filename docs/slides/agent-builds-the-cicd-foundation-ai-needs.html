<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<title>AI agent 專案的目的</title>
<style>
:root{--paper:#fff;--surface:#fff;--surface-2:#eef2f5;--ink:#17212b;--ink-2:#48596a;--ink-3:#78889a;--rule:#cfd9e1;--rule-2:#aebbc7;
--goal:#116b64;--warn:#a0580f;--agent:#2f6f9f;--pm:#7a4f9a;
--mono:"SF Mono",Menlo,Consolas,"PingFang TC","Noto Sans TC","Microsoft JhengHei",monospace;
--sans:"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
html,body{margin:0;padding:0;background:#fff;color:var(--ink);font-family:var(--sans)}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4 landscape;margin:0}
.slide{width:297mm;height:210mm;box-sizing:border-box;padding:11mm 14mm 9mm;display:flex;flex-direction:column;break-after:page;page-break-after:always;overflow:hidden;position:relative}
.slide:last-child{break-after:auto;page-break-after:auto}
@media screen{body{background:#e6ebef}.slide{background:#fff;margin:8mm auto;box-shadow:0 1px 4px rgba(0,0,0,.12)}}
.kicker{font-family:var(--mono);font-size:9.5pt;letter-spacing:.06em;color:var(--ink-3);margin:0 0 2mm}
.slide h1{font-family:var(--sans);font-size:20pt;font-weight:600;margin:0 0 5mm;line-height:1.25}
.fig{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.fig svg{display:block;color:var(--ink)}
.pn{position:absolute;right:14mm;bottom:6mm;font-family:var(--mono);font-size:8.5pt;color:var(--ink-3)}
.tx{font-family:var(--mono);font-size:12px;fill:currentColor}
.tx-s{font-family:var(--mono);font-size:10.5px;fill:var(--ink-3)}
.tx-b{font-family:var(--sans);font-size:15px;font-weight:700;fill:currentColor}
.tx-lbl{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;fill:var(--ink-3)}
</style>
</head>
<body>
<section class="slide"><div class="kicker">AI agent 專案的目的　·　圖 1 ／ 1</div><h1>目的：在 IC 設計團隊建起 CI/CD，讓 AI 的效益跨出組織疆界</h1><div class="fig"><svg style="width:269.0mm;height:146.7mm" viewBox="0 0 880 480" role="img" aria-label="五層的依賴圖，由上而下：公司競爭力、AI 效益跨出組織疆界、迭代式開發、CI/CD、本專案。CI/CD 那層以虛線標示為目前缺的一層；最底下的本專案以箭頭指向 CI/CD，表示本專案要把它建起來。" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><defs><marker id="ar-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker></defs><defs><marker id="ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--goal)"/></marker></defs><defs><marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--agent)"/></marker></defs><defs><marker id="ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--pm)"/></marker></defs><defs><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-3)"/></marker></defs>
<text class="tx-lbl" x="20.0" y="20.0" text-anchor="start" fill="var(--ink-2)">這份文件回答：這個 AI agent 專案為什麼存在、要達成什麼、方向由誰掌握 ↓</text>
<rect x="280.0" y="44.0" width="300.0" height="54.0" fill="var(--surface-2)" stroke="var(--rule-2)" stroke-width="1.2"/>
<text class="tx" x="430.0" y="67.0" text-anchor="middle" fill="var(--ink-2)" style="font-weight:700">公司競爭力</text>
<text class="tx-s" x="430.0" y="86.0" text-anchor="middle" fill="var(--ink-3)">更快、更可靠地交出晶片</text>
<rect x="240.0" y="110.0" width="380.0" height="54.0" fill="var(--surface-2)" stroke="var(--rule-2)" stroke-width="1.2"/>
<text class="tx" x="430.0" y="133.0" text-anchor="middle" fill="var(--ink-2)" style="font-weight:700">AI 效益跨出組織疆界</text>
<text class="tx-s" x="430.0" y="152.0" text-anchor="middle" fill="var(--ink-3)">AI 的產出跨團隊被信任、被採用</text>
<rect x="200.0" y="176.0" width="460.0" height="54.0" fill="var(--surface-2)" stroke="var(--rule-2)" stroke-width="1.2"/>
<text class="tx" x="430.0" y="199.0" text-anchor="middle" fill="var(--ink-2)" style="font-weight:700">迭代式開發</text>
<text class="tx-s" x="430.0" y="218.0" text-anchor="middle" fill="var(--ink-3)">tape-out 前小步改、頻繁整合</text>
<rect x="160.0" y="242.0" width="540.0" height="54.0" fill="var(--warn)" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="6 4" fill-opacity=".06"/>
<text class="tx" x="430.0" y="265.0" text-anchor="middle" fill="var(--warn)" style="font-weight:700">CI/CD</text>
<text class="tx-s" x="430.0" y="284.0" text-anchor="middle" fill="var(--ink-2)">每個變更自動驗證，每個結果查得到版本</text>
<rect x="120.0" y="308.0" width="620.0" height="54.0" fill="var(--agent)" stroke="var(--agent)" stroke-width="2" fill-opacity=".14"/>
<text class="tx" x="430.0" y="331.0" text-anchor="middle" fill="var(--agent)" style="font-weight:700">本專案：CI/CD Mentor Agent</text>
<text class="tx-s" x="430.0" y="350.0" text-anchor="middle" fill="var(--ink-2)">AI agent 自主運行，人類 PM 掌握方向</text>
<rect x="66.9" y="259.0" width="81.1" height="20.0" rx="10" fill="var(--warn)" stroke="var(--warn)" stroke-width="1" fill-opacity=".14"/>
<text class="tx-s" x="107.4" y="273.0" text-anchor="middle" fill="var(--warn)" style="font-weight:700">目前缺這一層</text>
<path d="M744.0,335.0 C810.0,335.0 810.0,269.0 708.0,269.0" fill="none" stroke="var(--agent)" stroke-width="2" marker-end="url(#ar-a)"/>
<text class="tx" x="818.0" y="306.0" text-anchor="start" fill="var(--agent)" style="font-weight:700">把它建起來</text>
<line x1="40.0" y1="362.0" x2="40.0" y2="48.0" stroke="var(--ink-3)" stroke-width="1.2" marker-end="url(#ar-gray)"/>
<text class="tx-s" x="50.0" y="58.0" text-anchor="start" fill="var(--ink-3)">上層</text>
<text class="tx-s" x="50.0" y="358.0" text-anchor="start" fill="var(--ink-3)">下層撐住上層</text>
<line x1="20.0" y1="392.0" x2="860.0" y2="392.0" stroke="var(--rule)" stroke-width="1"/>
<text class="tx" x="20.0" y="418.0" text-anchor="start" fill="var(--ink-2)" style="font-weight:600">AI 的效益要跨出個人與單一團隊，它的產出必須能被機器驗證、查得到來源，CI/CD 正是做這件事的那一層。</text>
<text class="tx" x="20.0" y="442.0" text-anchor="start" fill="var(--ink-2)">公司 IC 設計團隊的版控多半只當作備份，這一層幾乎是空的。</text>
</svg></div><div class="pn">1 / 1</div></section>
</body>
</html>
